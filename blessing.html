<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">
  <title>Transfer Units</title>
  <link rel="stylesheet" href="blessing.css">
</head>
<body>
  <div class="container">
    <div class="title">← Back &nbsp; Transfer units</div>

    <label>Recipient ID</label>
    <input type="text" placeholder="Ex: user-456-def">

    <label>Amount to transfer (units)</label>
    <input type="number" placeholder="Ex: 500">
    <div class="info">Your current balance: 1,310 units</div>

    <label>PIN (simulated)</label>
    <input type="password" placeholder="Enter your PIN">

    <button class="btn">Transfer ... units</button>

    <div class="test-ids">
      <strong>Test IDs available for transfer</strong>
      <div class="id-row">
        <span><span class="badge">user-456-def</span> - Jane Smith</span>
        <span class="to-use">To use</span>
      </div>
      <div class="id-row">
        <span><span class="badge">user-789-ghi</span> - Peter Jones</span>
        <span class="to-use">To use</span>
      </div>
      </div>
    </div>
  </div>
  <footer class="footer">
  <div class="footer-item">
    <span class="icon">📁</span>
    <p>Welcome</p>
  </div>
  <div class="footer-item">
    <span class="icon">🔍</span>
    <p>Pay</p>
  </div>
  <div class="footer-item active">
    <span class="icon">✉</span>
    <p>Transfer</p>
  </div>
  <div class="footer-item">
    <span class="icon">🏃‍♂</span>
    <p>Run</p>
  </div>
</footer>
</div>
</html>
